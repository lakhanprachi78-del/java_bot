spring.application.name=rag-backend
server.port=${RAG_PORT:8000}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

LLM_API_KEY=${GEMINI_API_KEY:${DEEPSEEK_API_KEY:${OPENAI_API_KEY:}}}
LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai
LLM_MODEL=gemini-flash-lite-latest

# SQLite file backing the semantic query cache (Q&A + feedback counts).
# Relative path is resolved from wherever "mvn spring-boot:run" is started.
spring.datasource.url=jdbc:sqlite:${RAG_CACHE_DB:./cache.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=never