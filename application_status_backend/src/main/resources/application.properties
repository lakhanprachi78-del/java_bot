spring.application.name=application_status_backend
# Must be 5000 - matches the Angular frontend's environment.ts losWsUrl
# (ws://127.0.0.1:5000/ws). Change both together if you ever move this.
server.port=5000

# --- Everything below is read from OS environment variables at startup ---
# (mirrors config.py: DATABASE_URL, LLM_API_KEY, LLM_MODEL live in your .env,
# nowhere else). Spring resolves ${DATABASE_URL} etc straight from the
# process environment, so simply exporting these before `java -jar ...`
# (or setting them in your IDE run config / systemd unit / Docker env)
# is the Java equivalent of python-dotenv's load_dotenv().
#
# DATABASE_URL   e.g. postgresql://username:password@host:5432/databasename
# LLM_API_KEY    the Gemini API key (called OPENROUTER_API_KEY in the old
#                Python .env — same key, this project just names it what
#                it actually is per your instruction)
# LLM_MODEL      e.g. gemini-2.0-flash — must be tool-calling-capable

app.database-url=${DATABASE_URL:postgresql://username:password@host:5432/databasename}
app.llm-api-key=${LLM_API_KEY:}
app.llm-model=${LLM_MODEL:openai/gpt-4o-mini}
app.max-rows-returned=${MAX_ROWS_RETURNED:25}
app.rag-chat-url=${RAG_CHAT_URL:http://127.0.0.1:8000/api/chat}
app.support-email=${SUPPORT_EMAIL:skaleupprodsupport@ugrocapital.com}

# Local SQLite log files (query_log.db / feedback_log.db equivalents) — a
# relative path here creates them in the working directory, same as the
# Python version defaulting to PROJECT_ROOT.
app.query-log-db-path=${LOS_QUERY_LOG_DB_PATH:los_query_log.db}
app.feedback-log-db-path=${LOS_FEEDBACK_LOG_DB_PATH:los_feedback_log.db}

# We manage the JPA datasource ourselves in DataSourceConfig (DATABASE_URL
# arrives in SQLAlchemy/libpq style: postgresql://user:pass@host:port/db —
# not JDBC style — so it needs parsing before Spring/Hikari can use it).
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=dmcredit
logging.level.org.hibernate.SQL=info

# REST DTOs (ChatRequest/ChatResponse/etc) use camelCase Java fields but
# must serialize as snake_case JSON (session_id, has_more, query_id, ...)
# to match what the Angular frontend already sends/expects, and what the
# old Python/FastAPI API produced.
spring.jackson.property-naming-strategy=SNAKE_CASE
